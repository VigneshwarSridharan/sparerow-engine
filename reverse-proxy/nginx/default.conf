# HTTP → HTTPS redirect
server {
  listen 80;
  listen [::]:80;
  server_name _;

  # ACME challenge for Let's Encrypt
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Redirect all other HTTP traffic to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# HTTPS server (SSL configured)
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name _;

  # SSL certificates (provisioned by Certbot)
  ssl_certificate /etc/letsencrypt/live/DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

  # SSL configuration
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers on;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 10m;

  client_max_body_size 100M;

  # GraphQL, REST API & admin plugin APIs → Strapi
  # Note: Strapi v5 plugin APIs live at root-level paths (/content-manager,
  # /content-type-builder, /upload, ...) — they must be proxied to Strapi or
  # the admin panel hangs on a loading spinner receiving storefront HTML.
  location ~ ^/(graphql|api|admin|uploads?|content-manager|content-type-builder|users-permissions|i18n|email|webhooks) {
    proxy_pass http://strapi_prod:1337;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
  }

  # Storefront (React) → serves from / (static + SPA routing)
  location / {
    proxy_pass http://storefront_prod:80;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
