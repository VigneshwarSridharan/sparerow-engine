# Optional Postgres for local development (use with docker-compose.yml).
# Usage: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
#
# Ensure spare-parts-backend/.env uses DATABASE_CLIENT=postgres or rely on overrides below.
services:
  postgres:
    container_name: spare-parts-postgres-dev
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strapi}
      POSTGRES_DB: ${POSTGRES_DB:-strapi_spare}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-strapi} -d ${POSTGRES_DB:-strapi_spare}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  strapi:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-strapi}:${POSTGRES_PASSWORD:-strapi}@postgres:5432/${POSTGRES_DB:-strapi_spare}

volumes:
  postgres_dev_data:
    name: spare_parts_postgres_dev_data
