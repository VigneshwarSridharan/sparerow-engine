# Production-oriented stack: Postgres + Strapi (`target: production`).
# Usage:
#   cp spare-parts-backend/.env.docker.example spare-parts-backend/.env
#   Fill in production secrets in .env (APP_KEYS, JWT secrets, STRAPI_INTERNAL_API_KEY, etc.)
#   docker compose -f docker-compose.prod.yml up --build -d
#
# DATABASE_URL below overrides .env for container-to-container networking.
services:
  postgres:
    container_name: spare-parts-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-strapi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strapi}
      POSTGRES_DB: ${POSTGRES_DB:-strapi_spare}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-strapi} -d ${POSTGRES_DB:-strapi_spare}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  strapi:
    container_name: spare-parts-strapi
    build:
      context: ./spare-parts-backend
      dockerfile: Dockerfile
      target: production
    restart: unless-stopped
    ports:
      - "${STRAPI_PORT:-1337}:1337"
    env_file:
      - ./spare-parts-backend/.env
    environment:
      HOST: 0.0.0.0
      DATABASE_CLIENT: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-strapi}:${POSTGRES_PASSWORD:-strapi}@postgres:5432/${POSTGRES_DB:-strapi_spare}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    name: spare_parts_postgres_data
