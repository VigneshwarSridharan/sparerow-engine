# Local development: SQLite (default), hot-reload, bind-mounted source + Vite storefront.
#
# First run:
#   cp spare-parts-backend/.env.docker.example spare-parts-backend/.env
#   Edit secrets in .env — do not commit .env
#
# Storefront → Strapi GraphQL: defaults to http://localhost:1337/graphql (browser calls host port).
# Override: VITE_STOREFRONT_GRAPHQL_ENDPOINT=https://api.example.com/graphql docker compose up
#
# Postgres alongside Strapi (prod-like DB):
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
#
services:
  strapi:
    container_name: spare-parts-strapi-dev
    build:
      context: ./spare-parts-backend
      dockerfile: Dockerfile
      target: development
    ports:
      - "${STRAPI_PORT:-1337}:1337"
    env_file:
      - ./spare-parts-backend/.env
    environment:
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./spare-parts-backend:/app
      - strapi_node_modules:/app/node_modules
    entrypoint: ["sh", "/app/docker-entrypoint.dev.sh"]
    command: ["npm", "run", "develop"]

  storefront:
    container_name: spare-parts-storefront-dev
    build:
      context: ./storefront
      dockerfile: Dockerfile
      target: development
    ports:
      - "${STOREFRONT_PORT:-8080}:8080"
    environment:
      VITE_STOREFRONT_GRAPHQL_ENDPOINT: ${VITE_STOREFRONT_GRAPHQL_ENDPOINT:-http://localhost:1337/graphql}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./storefront:/app
      - storefront_node_modules:/app/node_modules
    entrypoint: ["sh", "/app/docker-entrypoint.dev.sh"]
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
    depends_on:
      - strapi

volumes:
  strapi_node_modules:
    name: spare_parts_strapi_node_modules
  storefront_node_modules:
    name: spare_parts_storefront_node_modules
